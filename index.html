<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PropTrack - Property Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f7f8fc; }
@media print {
  .no-print { display: none !important; }
  body { background: #fff; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const C = { navy:"#1a2744", accent:"#e8a838", red:"#dc3545", green:"#2e7d32", blue:"#1565c0", orange:"#d84315", bg:"#f7f8fc", white:"#fff", border:"#e2e6ef", text:"#1a2744", muted:"#6b7a99" };

const SUPABASE_URL = "https://gistxdxxaehbekgivcks.supabase.co";
const SUPABASE_KEY = "sb_publishable_S4PvtoVtTRQSxrMhpb5U5Q_4oUpqIcK";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TRADES = ["Plumbing","Electrical","HVAC","Roofing","General","Landscaping","Painting","Flooring","Appliance","Other"];

const inp = {width:"100%",padding:"8px",border:"1px solid #e2e6ef",borderRadius:6,fontSize:14,background:"#f7f8fc",boxSizing:"border-box",marginBottom:10};
const btnP = {background:C.navy,color:"#fff",border:"none",borderRadius:6,padding:"9px 18px",fontWeight:600};
const btnS = {background:"transparent",color:C.navy,border:"1px solid "+C.border,borderRadius:6,padding:"9px 18px",fontWeight:600};
const btnDanger = {background:"transparent",color:C.red,border:"1px solid "+C.red,borderRadius:6,padding:"9px 18px",fontWeight:600};
const btnDangerSm = {background:"transparent",color:C.red,border:"1px solid "+C.red,borderRadius:6,padding:"5px 10px",fontWeight:600,fontSize:12,cursor:"pointer"};

// Extracts the storage object path from a Supabase public URL for the repair-photos bucket
function extractStoragePath(url){
if(!url)return null;
const marker="/repair-photos/";
const idx=url.indexOf(marker);
if(idx===-1)return null;
return url.slice(idx+marker.length);
}

// Basic HTML-escaping so user-entered text can't break the generated report page
function escapeHtml(str){
if(str===null||str===undefined)return "";
return String(str).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Builds a standalone, styled HTML report page for an inspection (letterhead + sections + photos)
function buildInspectionReportHtml(insp,propertyAddress,contractorNameFn){
const total=(insp.sections||[]).reduce((s,sec)=>s+Number(sec.cost),0);
const sectionsHtml=(insp.sections||[]).length===0
?`<p style="color:#6b7a99;">No sections recorded.</p>`
:(insp.sections||[]).map(sec=>`
<div style="background:#fff;border:1px solid #e2e6ef;border-radius:10px;padding:16px;margin-bottom:14px;">
<div style="display:flex;justify-content:space-between;align-items:baseline;">
<strong style="font-size:16px;color:#1a2744;">${escapeHtml(sec.name)}</strong>
<span style="color:#2e7d32;font-weight:700;">$${escapeHtml(sec.cost)}</span>
</div>
${sec.contractorId?`<p style="color:#6b7a99;font-size:13px;margin-top:6px;">Contractor: ${escapeHtml(contractorNameFn(sec.contractorId))}</p>`:""}
${sec.notes?`<p style="font-size:13px;margin-top:6px;">${escapeHtml(sec.notes)}</p>`:""}
${sec.photoUrl?`<img src="${sec.photoUrl}" style="max-width:100%;border-radius:8px;margin-top:10px;display:block;"/>`:""}
</div>
`).join("");
return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>${escapeHtml(insp.inspection_type)} Inspection Report</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f8fc;margin:0;padding:0;color:#1a2744;}
.wrap{max-width:640px;margin:0 auto;padding:30px 20px;}
.letterhead{text-align:center;border-bottom:2px solid #1a2744;padding-bottom:16px;margin-bottom:24px;}
.letterhead h1{font-size:22px;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;}
.letterhead .address{font-size:16px;color:#6b7a99;}
.meta{color:#6b7a99;font-size:14px;margin-bottom:20px;}
.total{font-size:16px;margin-bottom:20px;}
</style>
</head>
<body>
<div class="wrap">
<div class="letterhead">
<h1>${escapeHtml(insp.inspection_type)} Inspection Report</h1>
<div class="address">${escapeHtml(propertyAddress)}</div>
</div>
<div class="meta">Inspection Date: ${escapeHtml(insp.inspection_date)}</div>
<div class="total"><strong>Total Estimate:</strong> $${total}</div>
${sectionsHtml}
</div>
</body>
</html>`;
}

function Modal({title,onClose,children}){
return (
<div style={{position:"fixed",inset:0,background:"#0006",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
<div style={{background:"#fff",borderRadius:12,padding:24,width:460,maxWidth:"92vw",maxHeight:"85vh",overflowY:"auto"}}>
<div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
<h3 style={{margin:0,color:C.navy}}>{title}</h3>
<button onClick={onClose} style={{background:"none",border:"none",fontSize:22}}>×</button>
</div>
{children}
</div>
</div>
);
}

function AuthScreen(){
const [mode,setMode]=useState("login");
const [email,setEmail]=useState("");
const [password,setPassword]=useState("");
const [error,setError]=useState("");
const [loading,setLoading]=useState(false);

const submit=async()=>{
setError("");
setLoading(true);
if(mode==="login"){
const {error}=await sb.auth.signInWithPassword({email,password});
if(error)setError(error.message);
}else if(mode==="signup"){
const {error}=await sb.auth.signUp({email,password});
if(error)setError(error.message);
else setError("Account created! Check your email to confirm, then log in.");
}else if(mode==="reset"){
const {error}=await sb.auth.resetPasswordForEmail(email);
if(error)setError(error.message);
else setError("Password reset email sent! Check your inbox.");
}
setLoading(false);
};

return (
<div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:C.bg}}>
<div style={{background:"#fff",padding:32,borderRadius:12,width:360,maxWidth:"90vw",boxShadow:"0 4px 20px #0001"}}>
<h2 style={{color:C.navy,marginBottom:4}}>PropTrack</h2>
<div style={{color:C.muted,marginBottom:20,fontSize:14}}>{mode==="login"?"Log in to your account":mode==="signup"?"Create a new account":"Reset your password"}</div>
<input style={inp} type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)}/>
{mode!=="reset"&&<input style={inp} type="password" placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)}/>}
{error&&<div style={{color:(error.includes("created")||error.includes("sent"))?C.green:C.red,fontSize:13,marginBottom:10}}>{error}</div>}
<button style={{...btnP,width:"100%",marginBottom:10}} onClick={submit} disabled={loading}>{loading?"Please wait...":mode==="login"?"Log In":mode==="signup"?"Sign Up":"Send Reset Email"}</button>
<div style={{textAlign:"center",fontSize:13,color:C.muted}}>
{mode==="login"&&(<React.Fragment>
Don't have an account? <span style={{color:C.blue,cursor:"pointer"}} onClick={()=>{setMode("signup");setError("");}}>Sign up</span>
<div style={{marginTop:8}}><span style={{color:C.blue,cursor:"pointer"}} onClick={()=>{setMode("reset");setError("");}}>Forgot password?</span></div>
</React.Fragment>)}
{mode==="signup"&&<span>Already have an account? <span style={{color:C.blue,cursor:"pointer"}} onClick={()=>{setMode("login");setError("");}}>Log in</span></span>}
{mode==="reset"&&<span style={{color:C.blue,cursor:"pointer"}} onClick={()=>{setMode("login");setError("");}}>Back to login</span>}
</div>
</div>
</div>
);
}

function App(){
const [session,setSession]=useState(null);
const [checkingSession,setCheckingSession]=useState(true);
const [tab,setTab]=useState("Dashboard");
const [properties,setProperties]=useState([]);
const [repairs,setRepairs]=useState([]);
const [rentHistory,setRentHistory]=useState([]);
const [damages,setDamages]=useState([]);
const [contractors,setContractors]=useState([]);
const [inspections,setInspections]=useState([]);
const [modal,setModal]=useState(null);
const [form,setForm]=useState({});
const [loadingData,setLoadingData]=useState(false);
const [viewInspection,setViewInspection]=useState(null);
const [printRepair,setPrintRepair]=useState(null);
const [printInspection,setPrintInspection]=useState(null);

useEffect(()=>{
sb.auth.getSession().then(({data})=>{
setSession(data.session);
setCheckingSession(false);
});
const {data:listener}=sb.auth.onAuthStateChange((_event,session)=>{
setSession(session);
});
return ()=>listener.subscription.unsubscribe();
},[]);

useEffect(()=>{
if(session)loadAllData();
},[session]);

const loadAllData=async()=>{
setLoadingData(true);
const [p,r,rh,d,c,ins]=await Promise.all([
sb.from("properties").select("*").order("id"),
sb.from("repairs").select("*").order("id"),
sb.from("rent_history").select("*").order("id"),
sb.from("damages").select("*").order("id"),
sb.from("contractors").select("*").order("id"),
sb.from("inspections").select("*").order("id"),
]);
if(p.data)setProperties(p.data);
if(r.data)setRepairs(r.data);
if(rh.data)setRentHistory(rh.data);
if(d.data)setDamages(d.data);
if(c.data)setContractors(c.data);
if(ins.data)setInspections(ins.data);
setLoadingData(false);
};

const openModal=(t)=>{setModal(t);setForm({});};
const closeModal=()=>{setModal(null);setForm({});};
const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
const userId=()=>session.user.id;

const showErr=(error)=>{
if(error)alert("Something went wrong: "+error.message);
};

const addProperty=async()=>{
if(!form.address||!form.tenant)return;
const {data,error}=await sb.from("properties").insert({user_id:userId(),address:form.address,tenant:form.tenant,rent:Number(form.rent)||0,lease_end:form.leaseEnd||null}).select();
showErr(error);
if(data)setProperties(p=>[...p,...data]);
closeModal();
};

const addRepair=async()=>{
if(!form.title||!form.propertyId)return;
let photoUrl=null;
if(form.photoFile){
const fileName=`${userId()}/${Date.now()}_${form.photoFile.name}`;
const {data:up,error:upErr}=await sb.storage.from("repair-photos").upload(fileName,form.photoFile);
if(!upErr){
const {data:urlData}=sb.storage.from("repair-photos").getPublicUrl(fileName);
photoUrl=urlData.publicUrl;
}
}
const {data,error}=await sb.from("repairs").insert({user_id:userId(),property_id:Number(form.propertyId),title:form.title,priority:form.priority||"Medium",status:"Open",cost:Number(form.cost)||0,notes:form.notes||"",trade:form.trade||"General",photo_url:photoUrl}).select();
showErr(error);
if(data)setRepairs(r=>[...r,...data]);
closeModal();
};

const addRentIncrease=async()=>{
if(!form.propertyId||!form.newRent)return;
const prop=properties.find(p=>p.id===Number(form.propertyId));
const {data,error}=await sb.from("rent_history").insert({user_id:userId(),property_id:Number(form.propertyId),old_rent:prop?prop.rent:0,new_rent:Number(form.newRent),effective_date:form.effectiveDate||null,reason:form.reason||""}).select();
showErr(error);
if(data){
setRentHistory(h=>[...h,...data]);
await sb.from("properties").update({rent:Number(form.newRent)}).eq("id",Number(form.propertyId));
setProperties(ps=>ps.map(p=>p.id===Number(form.propertyId)?{...p,rent:Number(form.newRent)}:p));
}
closeModal();
};

const addDamage=async()=>{
if(!form.propertyId||!form.description)return;
const {data,error}=await sb.from("damages").insert({user_id:userId(),property_id:Number(form.propertyId),description:form.description,severity:form.severity||"Minor",estimated_cost:Number(form.estimatedCost)||0,status:"Pending"}).select();
showErr(error);
if(data)setDamages(d=>[...d,...data]);
closeModal();
};

const addContractor=async()=>{
if(!form.name||!form.trade)return;
const {data,error}=await sb.from("contractors").insert({user_id:userId(),name:form.name,trade:form.trade,phone:form.phone||"",email:form.cemail||"",notes:form.cnotes||""}).select();
showErr(error);
if(data)setContractors(c=>[...c,...data]);
closeModal();
};

const addInspection=async()=>{
if(!form.propertyId||!form.inspectionType)return;
const {data,error}=await sb.from("inspections").insert({user_id:userId(),property_id:Number(form.propertyId),inspection_type:form.inspectionType,inspection_date:new Date().toISOString().slice(0,10),sections:[]}).select();
showErr(error);
if(data)setInspections(i=>[...i,...data]);
closeModal();
};

const addInspectionSection=async(inspectionId)=>{
if(!form.sectionName)return;
const insp=inspections.find(i=>i.id===inspectionId);
let photoUrl=null;
if(form.sectionPhoto){
const fileName=`${userId()}/${Date.now()}_${form.sectionPhoto.name}`;
const {error:upErr}=await sb.storage.from("repair-photos").upload(fileName,form.sectionPhoto);
if(!upErr){
const {data:urlData}=sb.storage.from("repair-photos").getPublicUrl(fileName);
photoUrl=urlData.publicUrl;
}
}
const newSections=[...(insp.sections||[]),{name:form.sectionName,cost:Number(form.sectionCost)||0,contractorId:form.sectionContractor||null,photoUrl,notes:form.sectionNotes||""}];
const {error}=await sb.from("inspections").update({sections:newSections}).eq("id",inspectionId);
showErr(error);
setInspections(insps=>insps.map(i=>i.id===inspectionId?{...i,sections:newSections}:i));
setForm({});
};

const updateRepairStatus=async(id,status)=>{
const {error}=await sb.from("repairs").update({status}).eq("id",id);
showErr(error);
setRepairs(rs=>rs.map(r=>r.id===id?{...r,status}:r));
};

const updateDamageStatus=async(id,status)=>{
const {error}=await sb.from("damages").update({status}).eq("id",id);
showErr(error);
setDamages(ds=>ds.map(d=>d.id===id?{...d,status}:d));
};

// ---- DELETE FUNCTIONS ----

const deleteProperty=async(p)=>{
if(!window.confirm(`Delete property "${p.address}"?\n\nThis does not automatically delete related repairs, damages, rent history, or inspections for this property — you may want to remove those first.`))return;
const {error}=await sb.from("properties").delete().eq("id",p.id);
showErr(error);
if(!error)setProperties(ps=>ps.filter(x=>x.id!==p.id));
};

const deleteRepair=async(r)=>{
if(!window.confirm(`Delete repair "${r.title}"? This cannot be undone.`))return;
if(r.photo_url){
const path=extractStoragePath(r.photo_url);
if(path)await sb.storage.from("repair-photos").remove([path]);
}
const {error}=await sb.from("repairs").delete().eq("id",r.id);
showErr(error);
if(!error)setRepairs(rs=>rs.filter(x=>x.id!==r.id));
};

const deleteRentRecord=async(r)=>{
if(!window.confirm("Delete this rent history record?"))return;
const {error}=await sb.from("rent_history").delete().eq("id",r.id);
showErr(error);
if(!error)setRentHistory(hs=>hs.filter(x=>x.id!==r.id));
};

const deleteDamage=async(d)=>{
if(!window.confirm("Delete this damage record?"))return;
const {error}=await sb.from("damages").delete().eq("id",d.id);
showErr(error);
if(!error)setDamages(ds=>ds.filter(x=>x.id!==d.id));
};

const deleteContractor=async(c)=>{
if(!window.confirm(`Delete contractor "${c.name}"?`))return;
const {error}=await sb.from("contractors").delete().eq("id",c.id);
showErr(error);
if(!error)setContractors(cs=>cs.filter(x=>x.id!==c.id));
};

const deleteInspection=async(insp)=>{
if(!window.confirm(`Delete inspection "${insp.inspection_type}"? This will also delete all of its sections and photos.`))return;
const paths=(insp.sections||[]).map(s=>extractStoragePath(s.photoUrl)).filter(Boolean);
if(paths.length)await sb.storage.from("repair-photos").remove(paths);
const {error}=await sb.from("inspections").delete().eq("id",insp.id);
showErr(error);
if(!error){
setInspections(is=>is.filter(x=>x.id!==insp.id));
if(viewInspection===insp.id)setViewInspection(null);
}
};

const deleteInspectionSection=async(insp,index)=>{
if(!window.confirm("Delete this section?"))return;
const sec=insp.sections[index];
if(sec.photoUrl){
const path=extractStoragePath(sec.photoUrl);
if(path)await sb.storage.from("repair-photos").remove([path]);
}
const newSections=insp.sections.filter((_,i)=>i!==index);
const {error}=await sb.from("inspections").update({sections:newSections}).eq("id",insp.id);
showErr(error);
if(!error)setInspections(is=>is.map(i=>i.id===insp.id?{...i,sections:newSections}:i));
};

const propName=(id)=>{const p=properties.find(p=>p.id===id);return p?p.address.split(",")[0]:"Unknown";};
const contractorName=(id)=>{const c=contractors.find(c=>c.id===Number(id));return c?`${c.name} (${c.phone})`:"—";};
const contractorsForTrade=(trade)=>contractors.filter(c=>c.trade===trade);
const openRepairs=repairs.filter(r=>r.status!=="Resolved").length;
const monthlyRent=properties.reduce((s,p)=>s+Number(p.rent),0);

const logout=async()=>{await sb.auth.signOut();};

const emailRepair=(r)=>{
const subject=encodeURIComponent(`Repair Request: ${r.title}`);
const body=encodeURIComponent(`Property: ${propName(r.property_id)}\nIssue: ${r.title}\nPriority: ${r.priority}\nTrade: ${r.trade||"General"}\nNotes: ${r.notes||"None"}\n${r.photo_url?"Photo: "+r.photo_url:""}`);
window.location.href=`mailto:?subject=${subject}&body=${body}`;
};

const emailInspection=async(insp)=>{
const prop=properties.find(p=>p.id===insp.property_id);
const fullAddress=prop?prop.address:"Unknown property";
const subject=encodeURIComponent(`${insp.inspection_type} Inspection Report — ${propName(insp.property_id)}`);
const html=buildInspectionReportHtml(insp,fullAddress,contractorName);
const fileName=`${userId()}/reports/${Date.now()}_inspection_${insp.id}.html`;
const {error:upErr}=await sb.storage.from("repair-photos").upload(fileName,new Blob([html],{type:"text/html"}),{contentType:"text/html"});
if(upErr){
alert("Couldn't generate the hosted report link ("+upErr.message+"). Falling back to a plain-text email instead.");
const total=(insp.sections||[]).reduce((s,sec)=>s+Number(sec.cost),0);
const sectionLines=(insp.sections||[]).map(sec=>{
const contractorLine=sec.contractorId?` — ${contractorName(sec.contractorId)}`:"";
const notesLine=sec.notes?`\n  Notes: ${sec.notes}`:"";
const photoLine=sec.photoUrl?`\n  Photo: ${sec.photoUrl}`:"";
return `- ${sec.name}: $${sec.cost}${contractorLine}${notesLine}${photoLine}`;
}).join("\n");
const body=encodeURIComponent(`Property: ${fullAddress}\nInspection Type: ${insp.inspection_type}\nDate: ${insp.inspection_date}\n\nSections:\n${sectionLines||"None"}\n\nTotal Estimate: $${total}`);
window.location.href=`mailto:?subject=${subject}&body=${body}`;
return;
}
const {data:urlData}=sb.storage.from("repair-photos").getPublicUrl(fileName);
const reportUrl=urlData.publicUrl;
const body=encodeURIComponent(`Here is the ${insp.inspection_type} inspection report for ${fullAddress}:\n\n${reportUrl}`);
window.location.href=`mailto:?subject=${subject}&body=${body}`;
};

if(checkingSession){
return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",color:C.muted}}>Loading...</div>;
}

if(!session){
return <AuthScreen/>;
}

const TABS=["Dashboard","Properties","Repairs","Rent History","Damage Log","Inspections","Contractors"];

return (
<div style={{display:"flex",minHeight:"100vh"}}>
<div className="no-print" style={{width:200,background:C.navy,padding:20,color:"#fff",flexShrink:0,display:"flex",flexDirection:"column"}}>
<h2 style={{fontSize:18,marginBottom:20}}>PropTrack</h2>
{TABS.map(t=>(
<div key={t} onClick={()=>{setTab(t);setViewInspection(null);}} style={{padding:"10px 0",cursor:"pointer",color:tab===t?C.accent:"#fff",fontSize:14}}>{t}</div>
))}
<div style={{flex:1}}></div>
<div style={{fontSize:12,color:"#8fa0c0",marginBottom:8,wordBreak:"break-all"}}>{session.user.email}</div>
<button style={{...btnS,color:"#fff",borderColor:"#3a4a6b",fontSize:13,padding:"6px 12px"}} onClick={logout}>Log Out</button>
</div>
<div style={{flex:1,padding:24}}>
<div className="no-print" style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
<h1 style={{color:C.navy}}>{tab}</h1>
{tab==="Properties"&&<button style={btnP} onClick={()=>openModal("property")}>+ Add Property</button>}
{tab==="Repairs"&&<button style={btnP} onClick={()=>openModal("repair")}>+ Log Repair</button>}
{tab==="Rent History"&&<button style={btnP} onClick={()=>openModal("rent")}>+ Rent Increase</button>}
{tab==="Damage Log"&&<button style={btnP} onClick={()=>openModal("damage")}>+ Log Damage</button>}
{tab==="Contractors"&&<button style={btnP} onClick={()=>openModal("contractor")}>+ Add Contractor</button>}
{tab==="Inspections"&&!viewInspection&&<button style={btnP} onClick={()=>openModal("inspection")}>+ New Inspection</button>}
</div>

{loadingData&&<div style={{color:C.muted}}>Loading your data...</div>}

{!loadingData&&tab==="Dashboard"&&(
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:14}}>
<div style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border}}>
<div style={{fontSize:12,color:C.muted}}>Monthly Rent</div>
<div style={{fontSize:24,fontWeight:700,color:C.green}}>${monthlyRent}</div>
</div>
<div style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border}}>
<div style={{fontSize:12,color:C.muted}}>Open Repairs</div>
<div style={{fontSize:24,fontWeight:700,color:C.red}}>{openRepairs}</div>
</div>
<div style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border}}>
<div style={{fontSize:12,color:C.muted}}>Contractors</div>
<div style={{fontSize:24,fontWeight:700,color:C.blue}}>{contractors.length}</div>
</div>
<div style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border}}>
<div style={{fontSize:12,color:C.muted}}>Inspections</div>
<div style={{fontSize:24,fontWeight:700,color:C.orange}}>{inspections.length}</div>
</div>
</div>
)}

{!loadingData&&tab==="Properties"&&(properties.length===0?<div style={{color:C.muted}}>No properties yet. Add your first one!</div>:properties.map(p=>(
<div key={p.id} style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
<div>
<div style={{fontWeight:700}}>{p.address}</div>
<div style={{color:C.muted}}>Tenant: {p.tenant} — ${p.rent}/mo {p.lease_end?`— Lease ends ${p.lease_end}`:""}</div>
</div>
<button style={btnDangerSm} onClick={()=>deleteProperty(p)}>Delete</button>
</div>
)))}

{!loadingData&&tab==="Repairs"&&(repairs.length===0?<div style={{color:C.muted}}>No repairs logged yet.</div>:repairs.map(r=>(
<div key={r.id} style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border,marginBottom:10}}>
<div style={{fontWeight:700}}>{r.title}</div>
<div style={{color:C.muted,marginBottom:8}}>{propName(r.property_id)} — {r.trade||"General"} — {r.priority} priority — {r.status}</div>
{r.photo_url&&<img src={r.photo_url} style={{maxWidth:150,borderRadius:6,marginBottom:8,display:"block"}}/>}
<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
{r.status==="Open"&&<button style={{...btnS,padding:"5px 10px",fontSize:12}} onClick={()=>updateRepairStatus(r.id,"In Progress")}>Mark In Progress</button>}
{r.status==="In Progress"&&<button style={{...btnS,padding:"5px 10px",fontSize:12}} onClick={()=>updateRepairStatus(r.id,"Resolved")}>Mark Resolved</button>}
{r.status==="Resolved"&&<span style={{color:C.green,fontSize:12}}>✓ Resolved</span>}
<button style={{...btnS,padding:"5px 10px",fontSize:12}} onClick={()=>{setPrintRepair(r);setTimeout(()=>window.print(),100);}}>Print</button>
<button style={{...btnS,padding:"5px 10px",fontSize:12}} onClick={()=>emailRepair(r)}>Email</button>
<button style={btnDangerSm} onClick={()=>deleteRepair(r)}>Delete</button>
</div>
</div>
)))}

{!loadingData&&tab==="Rent History"&&(rentHistory.length===0?<div style={{color:C.muted}}>No rent changes recorded yet.</div>:rentHistory.map(r=>(
<div key={r.id} style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
<div>
<div style={{fontWeight:700}}>{propName(r.property_id)}</div>
<div style={{color:C.muted}}>${r.old_rent} → ${r.new_rent} {r.effective_date?`(${r.effective_date})`:""} — {r.reason}</div>
</div>
<button style={btnDangerSm} onClick={()=>deleteRentRecord(r)}>Delete</button>
</div>
)))}

{!loadingData&&tab==="Damage Log"&&(damages.length===0?<div style={{color:C.muted}}>No damage reports yet.</div>:damages.map(d=>(
<div key={d.id} style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border,marginBottom:10}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
<div style={{fontWeight:700}}>{d.description}</div>
<button style={btnDangerSm} onClick={()=>deleteDamage(d)}>Delete</button>
</div>
<div style={{color:C.muted,marginBottom:8}}>{propName(d.property_id)} — {d.severity} — Est. ${d.estimated_cost}</div>
<select value={d.status} onChange={e=>updateDamageStatus(d.id,e.target.value)} style={{...inp,width:"auto",marginBottom:0}}>
<option>Pending</option><option>Deducted from deposit</option><option>Tenant paid</option><option>Disputed</option>
</select>
</div>
)))}

{!loadingData&&tab==="Contractors"&&(
TRADES.map(trade=>{
const list=contractorsForTrade(trade);
if(list.length===0)return null;
return (
<div key={trade} style={{marginBottom:16}}>
<h3 style={{color:C.navy,fontSize:15,marginBottom:8}}>{trade}</h3>
{list.map(c=>(
<div key={c.id} style={{background:"#fff",padding:14,borderRadius:10,border:"1px solid "+C.border,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
<div>
<div style={{fontWeight:700}}>{c.name}</div>
<div style={{color:C.muted,fontSize:13}}>{c.phone} {c.email?`— ${c.email}`:""}</div>
{c.notes&&<div style={{color:C.muted,fontSize:12,marginTop:4}}>{c.notes}</div>}
</div>
<button style={btnDangerSm} onClick={()=>deleteContractor(c)}>Delete</button>
</div>
))}
</div>
);
})
)}
{!loadingData&&tab==="Contractors"&&contractors.length===0&&<div style={{color:C.muted}}>No contractors added yet.</div>}

{!loadingData&&tab==="Inspections"&&!viewInspection&&(inspections.length===0?<div style={{color:C.muted}}>No inspections yet.</div>:inspections.map(insp=>{
const total=(insp.sections||[]).reduce((s,sec)=>s+Number(sec.cost),0);
return (
<div key={insp.id} style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
<div onClick={()=>setViewInspection(insp.id)} style={{cursor:"pointer",flex:1,minWidth:180}}>
<div style={{fontWeight:700}}>{insp.inspection_type} — {propName(insp.property_id)}</div>
<div style={{color:C.muted}}>{insp.inspection_date} — {(insp.sections||[]).length} section(s) — Est. Total: ${total}</div>
</div>
<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
<button style={{...btnS,padding:"5px 10px",fontSize:12}} onClick={(e)=>{e.stopPropagation();setPrintInspection(insp);setTimeout(()=>window.print(),100);}}>Print</button>
<button style={{...btnS,padding:"5px 10px",fontSize:12}} onClick={(e)=>{e.stopPropagation();emailInspection(insp);}}>Email</button>
<button style={btnDangerSm} onClick={(e)=>{e.stopPropagation();deleteInspection(insp);}}>Delete</button>
</div>
</div>
);
}))}

{!loadingData&&tab==="Inspections"&&viewInspection&&(()=>{
const insp=inspections.find(i=>i.id===viewInspection);
if(!insp)return null;
const total=(insp.sections||[]).reduce((s,sec)=>s+Number(sec.cost),0);
return (
<div>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
<button style={btnS} onClick={()=>setViewInspection(null)}>← Back to Inspections</button>
<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
<button style={{...btnS,padding:"9px 14px"}} onClick={()=>{setPrintInspection(insp);setTimeout(()=>window.print(),100);}}>Print</button>
<button style={{...btnS,padding:"9px 14px"}} onClick={()=>emailInspection(insp)}>Email</button>
<button style={btnDangerSm} onClick={()=>deleteInspection(insp)}>Delete Entire Inspection</button>
</div>
</div>
<h2 style={{color:C.navy}}>{insp.inspection_type} — {propName(insp.property_id)}</h2>
<div style={{color:C.muted,marginBottom:16}}>{insp.inspection_date} — Total Estimate: <strong style={{color:C.green}}>${total}</strong></div>
{(insp.sections||[]).map((sec,i)=>(
<div key={i} style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border,marginBottom:10}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
<div style={{fontWeight:700}}>{sec.name}</div>
<button style={btnDangerSm} onClick={()=>deleteInspectionSection(insp,i)}>Delete</button>
</div>
<div style={{color:C.muted,fontSize:13,marginBottom:6}}>Est. Cost: ${sec.cost} {sec.contractorId?`— ${contractorName(sec.contractorId)}`:""}</div>
{sec.notes&&<div style={{fontSize:13,color:C.muted,marginBottom:6}}>{sec.notes}</div>}
{sec.photoUrl&&<img src={sec.photoUrl} style={{maxWidth:200,borderRadius:6}}/>}
</div>
))}
<div style={{background:"#fff",padding:16,borderRadius:10,border:"1px dashed "+C.border,marginTop:16}}>
<h4 style={{marginBottom:10,color:C.navy}}>Add Section</h4>
<input style={inp} placeholder="Section name (e.g. Roofing, Plumbing)" onChange={e=>setF("sectionName",e.target.value)}/>
<input style={inp} type="number" placeholder="Estimated Cost" onChange={e=>setF("sectionCost",e.target.value)}/>
<select style={inp} onChange={e=>setF("sectionContractor",e.target.value)}>
<option value="">Assign Contractor (optional)</option>
{contractors.map(c=><option key={c.id} value={c.id}>{c.name} — {c.trade}</option>)}
</select>
<input style={inp} placeholder="Notes" onChange={e=>setF("sectionNotes",e.target.value)}/>
<input style={inp} type="file" accept="image/*" onChange={e=>setF("sectionPhoto",e.target.files[0])}/>
<button style={btnP} onClick={()=>addInspectionSection(insp.id)}>Add Section</button>
</div>
</div>
);
})()}

</div>

{printRepair&&(
<div style={{position:"fixed",inset:0,background:"#fff",zIndex:200,padding:30}}>
<button className="no-print" style={{...btnS,marginBottom:16}} onClick={()=>setPrintRepair(null)}>Close</button>
<h2>Repair Request</h2>
<p><strong>Property:</strong> {propName(printRepair.property_id)}</p>
<p><strong>Issue:</strong> {printRepair.title}</p>
<p><strong>Trade:</strong> {printRepair.trade||"General"}</p>
<p><strong>Priority:</strong> {printRepair.priority}</p>
<p><strong>Notes:</strong> {printRepair.notes||"None"}</p>
{printRepair.photo_url&&<img src={printRepair.photo_url} style={{maxWidth:300,marginTop:10}}/>}
</div>
)}

{printInspection&&(()=>{
const total=(printInspection.sections||[]).reduce((s,sec)=>s+Number(sec.cost),0);
const prop=properties.find(p=>p.id===printInspection.property_id);
const fullAddress=prop?prop.address:propName(printInspection.property_id);
return (
<div style={{position:"fixed",inset:0,background:"#fff",zIndex:200,padding:30,overflowY:"auto"}}>
<button className="no-print" style={{...btnS,marginBottom:16}} onClick={()=>setPrintInspection(null)}>Close</button>
<div style={{textAlign:"center",borderBottom:"2px solid "+C.navy,paddingBottom:16,marginBottom:20}}>
<h1 style={{fontSize:20,letterSpacing:0.5,textTransform:"uppercase",marginBottom:6}}>{printInspection.inspection_type} Inspection Report</h1>
<div style={{fontSize:15,color:C.muted}}>{fullAddress}</div>
</div>
<p style={{color:C.muted,marginBottom:6}}>Inspection Date: {printInspection.inspection_date}</p>
<p style={{marginBottom:16}}><strong>Total Estimate:</strong> ${total}</p>
{(printInspection.sections||[]).length===0&&<p>No sections recorded.</p>}
{(printInspection.sections||[]).map((sec,i)=>(
<div key={i} style={{marginBottom:16,paddingBottom:12,borderBottom:"1px solid #ddd"}}>
<p><strong>{sec.name}</strong> — ${sec.cost}{sec.contractorId?` — ${contractorName(sec.contractorId)}`:""}</p>
{sec.notes&&<p>Notes: {sec.notes}</p>}
{sec.photoUrl&&<img src={sec.photoUrl} style={{maxWidth:250,marginTop:6}}/>}
</div>
))}
</div>
);
})()}

{modal==="property"&&(
<Modal title="Add Property" onClose={closeModal}>
<input style={inp} placeholder="Address" onChange={e=>setF("address",e.target.value)}/>
<input style={inp} placeholder="Tenant Name" onChange={e=>setF("tenant",e.target.value)}/>
<input style={inp} type="number" placeholder="Monthly Rent" onChange={e=>setF("rent",e.target.value)}/>
<input style={inp} type="date" onChange={e=>setF("leaseEnd",e.target.value)}/>
<div style={{display:"flex",gap:10}}>
<button style={btnP} onClick={addProperty}>Add</button>
<button style={btnS} onClick={closeModal}>Cancel</button>
</div>
</Modal>
)}

{modal==="repair"&&(
<Modal title="Log Repair" onClose={closeModal}>
<select style={inp} onChange={e=>setF("propertyId",e.target.value)}>
<option value="">Select property…</option>
{properties.map(p=><option key={p.id} value={p.id}>{p.address}</option>)}
</select>
<input style={inp} placeholder="Description" onChange={e=>setF("title",e.target.value)}/>
<select style={inp} onChange={e=>setF("trade",e.target.value)}>
<option value="">Select Trade…</option>
{TRADES.map(t=><option key={t} value={t}>{t}</option>)}
</select>
<select style={inp} onChange={e=>setF("priority",e.target.value)}>
<option>Medium</option><option>High</option><option>Low</option>
</select>
<input style={inp} type="number" placeholder="Cost" onChange={e=>setF("cost",e.target.value)}/>
<input style={inp} placeholder="Notes" onChange={e=>setF("notes",e.target.value)}/>
<input style={inp} type="file" accept="image/*" onChange={e=>setF("photoFile",e.target.files[0])}/>
<div style={{display:"flex",gap:10}}>
<button style={btnP} onClick={addRepair}>Log Repair</button>
<button style={btnS} onClick={closeModal}>Cancel</button>
</div>
</Modal>
)}

{modal==="rent"&&(
<Modal title="Rent Increase" onClose={closeModal}>
<select style={inp} onChange={e=>setF("propertyId",e.target.value)}>
<option value="">Select property…</option>
{properties.map(p=><option key={p.id} value={p.id}>{p.address}</option>)}
</select>
<input style={inp} type="number" placeholder="New Rent" onChange={e=>setF("newRent",e.target.value)}/>
<input style={inp} type="date" onChange={e=>setF("effectiveDate",e.target.value)}/>
<input style={inp} placeholder="Reason" onChange={e=>setF("reason",e.target.value)}/>
<div style={{display:"flex",gap:10}}>
<button style={btnP} onClick={addRentIncrease}>Save</button>
<button style={btnS} onClick={closeModal}>Cancel</button>
</div>
</Modal>
)}

{modal==="damage"&&(
<Modal title="Log Damage" onClose={closeModal}>
<select style={inp} onChange={e=>setF("propertyId",e.target.value)}>
<option value="">Select property…</option>
{properties.map(p=><option key={p.id} value={p.id}>{p.address}</option>)}
</select>
<input style={inp} placeholder="Description" onChange={e=>setF("description",e.target.value)}/>
<select style={inp} onChange={e=>setF("severity",e.target.value)}>
<option>Minor</option><option>Moderate</option><option>Severe</option>
</select>
<input style={inp} type="number" placeholder="Estimated Cost" onChange={e=>setF("estimatedCost",e.target.value)}/>
<div style={{display:"flex",gap:10}}>
<button style={btnP} onClick={addDamage}>Log Damage</button>
<button style={btnS} onClick={closeModal}>Cancel</button>
</div>
</Modal>
)}

{modal==="contractor"&&(
<Modal title="Add Contractor" onClose={closeModal}>
<input style={inp} placeholder="Name" onChange={e=>setF("name",e.target.value)}/>
<select style={inp} onChange={e=>setF("trade",e.target.value)}>
<option value="">Select Trade…</option>
{TRADES.map(t=><option key={t} value={t}>{t}</option>)}
</select>
<input style={inp} placeholder="Phone" onChange={e=>setF("phone",e.target.value)}/>
<input style={inp} placeholder="Email" onChange={e=>setF("cemail",e.target.value)}/>
<input style={inp} placeholder="Notes" onChange={e=>setF("cnotes",e.target.value)}/>
<div style={{display:"flex",gap:10}}>
<button style={btnP} onClick={addContractor}>Add</button>
<button style={btnS} onClick={closeModal}>Cancel</button>
</div>
</Modal>
)}

{modal==="inspection"&&(
<Modal title="New Inspection" onClose={closeModal}>
<select style={inp} onChange={e=>setF("propertyId",e.target.value)}>
<option value="">Select property…</option>
{properties.map(p=><option key={p.id} value={p.id}>{p.address}</option>)}
</select>
<input style={inp} placeholder="Inspection Type (e.g. Move-in, New Acquisition)" onChange={e=>setF("inspectionType",e.target.value)}/>
<div style={{display:"flex",gap:10}}>
<button style={btnP} onClick={addInspection}>Create</button>
<button style={btnS} onClick={closeModal}>Cancel</button>
</div>
</Modal>
)}

</div>
);
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
