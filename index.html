// Extracts the storage object path from a Supabase public URL for a given bucket
function extractStoragePath(url, bucket) {
    if (!url)
        return null;
    const marker = `/${bucket}/`;
    const idx = url.indexOf(marker);
    if (idx === -1)
        return null;
    return url.slice(idx + marker.length);
}
// Fetches an image URL and converts it to a base64 data URL for PDF embedding
async function loadImageAsDataURL(url) {
    try {
        const res = await fetch(url);
        const blob = await res.blob();
        return await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }
    catch (e) {
        return null;
    }
}
// Gets natural pixel dimensions of a loaded image so it can be scaled proportionally in the PDF
function getImageSize(dataUrl) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ width: img.width, height: img.height });
        img.onerror = () => resolve({ width: 0, height: 0 });
        img.src = dataUrl;
    });
}
// Builds a letterhead-styled PDF report for an inspection (title, address, sections, embedded photos)
async function buildInspectionReportPdf(insp, propertyAddress, contractorNameFn) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const marginX = 40;
    const maxWidth = pageWidth - marginX * 2;
    let y = 50;
    const ensureSpace = (needed) => {
        if (y + needed > pageHeight - 40) {
            doc.addPage();
            y = 50;
        }
    };
    doc.setFont(undefined, "bold");
    doc.setFontSize(18);
    doc.text(`${insp.inspection_type} Inspection Report`, marginX, y);
    y += 10;
    doc.setDrawColor(26, 39, 68);
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 24;
    doc.setFont(undefined, "normal");
    doc.setFontSize(13);
    doc.text(propertyAddress, marginX, y);
    y += 20;
    doc.setFontSize(10);
    doc.setTextColor(107, 122, 153);
    doc.text(`Inspection Date: ${insp.inspection_date}`, marginX, y);
    doc.setTextColor(26, 39, 68);
    y += 26;
    const sections = insp.sections || [];
    if (sections.length === 0) {
        doc.setFontSize(11);
        doc.text("No sections recorded.", marginX, y);
    }
    for (const sec of sections) {
        ensureSpace(50);
        doc.setFontSize(13);
        doc.setFont(undefined, "bold");
        doc.text(sec.name, marginX, y);
        y += 18;
        doc.setFont(undefined, "normal");
        if (sec.contractorId) {
            doc.setFontSize(10);
            doc.setTextColor(107, 122, 153);
            doc.text(`Contractor: ${contractorNameFn(sec.contractorId)}`, marginX, y);
            doc.setTextColor(26, 39, 68);
            y += 14;
        }
        if (sec.notes) {
            doc.setFontSize(10);
            const lines = doc.splitTextToSize(sec.notes, maxWidth);
            ensureSpace(lines.length * 12);
            doc.text(lines, marginX, y);
            y += lines.length * 12 + 4;
        }
        if (sec.photoUrl) {
            const dataUrl = await loadImageAsDataURL(sec.photoUrl);
            if (dataUrl) {
                const dims = await getImageSize(dataUrl);
                const displayWidth = Math.min(240, maxWidth);
                const displayHeight = dims.width ? displayWidth * (dims.height / dims.width) : 160;
                ensureSpace(displayHeight + 10);
                try {
                    doc.addImage(dataUrl, "JPEG", marginX, y, displayWidth, displayHeight);
                }
                catch (e) { }
                y += displayHeight + 16;
            }
        }
        y += 8;
    }
    return doc.output("blob");
}

// Opens the device's mail app via a temporary anchor click, which is more reliable
// on mobile browsers than setting window.location.href directly (which can silently fail).
function openMailto(mailtoUrl) {
    try {
        const link = document.createElement("a");
        link.href = mailtoUrl;
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    catch (e) {
        alert("Couldn't open your email app. Please make sure a mail app is set up on this device.");
    }
}
// Retries a Supabase call a few times before giving up, to smooth over brief connection drops
async function withRetry(fn, attempts = 3, delayMs = 1000) {
    let lastError = null;
    for (let i = 0; i < attempts; i++) {
        const result = await fn();
        if (!result.error)
            return result;
        lastError = result.error;
        await new Promise(r => setTimeout(r, delayMs));
    }
    return { error: lastError };
}

        // A phone can fully reload this page after the back button or a long background —
        // wiping out any in-memory timer along with everything else. So the real 3-minute
        // cutoff is tracked here as a saved timestamp, checked fresh on every load, not just
        // while the page happens to stay running.
        const LOCK_DELAY_MS = 180000;
        const HIDDEN_AT_KEY = "pt_hidden_at";
        const markHidden = () => {
            try {
                localStorage.setItem(HIDDEN_AT_KEY, String(Date.now()));
            }
            catch (e) { }
        };
        const checkAndClear = () => {
            try {
                const hiddenAt = localStorage.getItem(HIDDEN_AT_KEY);
                localStorage.removeItem(HIDDEN_AT_KEY);
                if (hiddenAt && Date.now() - Number(hiddenAt) > LOCK_DELAY_MS) {
                    sb.auth.signOut();
                }
            }
            catch (e) { }
        };
        // Catches a full close-and-reopen that happened after the grace period — check the
        // instant this effect mounts, before anything else runs.
        checkAndClear();
        let liveTimer = null;
        const handleVisibility = () => {
            if (document.hidden) {
                markHidden();
                liveTimer = setTimeout(() => {
                    sb.auth.signOut();
                }, LOCK_DELAY_MS);
            }
            else {
                if (liveTimer) {
                    clearTimeout(liveTimer);
                    liveTimer = null;
                }
                checkAndClear();
            }
        };
        document.addEventListener("visibilitychange", handleVisibility);
        window.addEventListener("pagehide", markHidden);
        window.addEventListener("pageshow", checkAndClear);
        return () => {
            document.removeEventListener("visibilitychange", handleVisibility);
