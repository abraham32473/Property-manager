!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PropTrack - Property Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f7f8fc; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const C = { navy:"#1a2744", accent:"#e8a838", red:"#dc3545", green:"#2e7d32", blue:"#1565c0", orange:"#d84315", bg:"#f7f8fc", white:"#fff", border:"#e2e6ef", text:"#1a2744", muted:"#6b7a99" };
const props0 = [
{id:1,address:"42 Maple Street, Unit 3B",tenant:"Sarah Johnson",rent:1850,leaseEnd:"2026-12-31"},
{id:2,address:"108 Oak Avenue, Unit 1A",tenant:"Marcus Webb",rent:2200,leaseEnd:"2026-09-30"},
{id:3,address:"77 Pine Road, Unit 5C",tenant:"Lisa Chen",rent:1650,leaseEnd:"2027-03-31"}
];
const repairs0 = [
{id:1,propertyId:1,title:"Leaky faucet",priority:"Medium",status:"In Progress",date:"2026-06-10",cost:180,notes:"Plumber scheduled"},
{id:2,propertyId:2,title:"HVAC not cooling",priority:"High",status:"Open",date:"2026-06-20",cost:0,notes:"Awaiting quote"}
];
const rent0 = [
{id:1,propertyId:1,oldRent:1750,newRent:1850,effectiveDate:"2026-01-01",reason:"Annual increase"}
];
const dmg0 = [
{id:1,propertyId:3,description:"Hole in drywall",severity:"Moderate",reportedDate:"2026-05-30",estimatedCost:320,status:"Pending"}
];
function App(){
const [tab,setTab]=useState("Dashboard");
const [properties]=useState(props0);
const [repairs]=useState(repairs0);
const [rentHistory]=useState(rent0);
const [damages]=useState(dmg0);
const openRepairs=repairs.filter(r=>r.status!=="Resolved").length;
const monthlyRent=properties.reduce((s,p)=>s+p.rent,0);
const propName=(id)=>{const p=properties.find(p=>p.id===id);return p?p.address.split(",")[0]:"Unknown";};
return (
<div style={{display:"flex",minHeight:"100vh"}}>
<div style={{width:200,background:C.navy,padding:20,color:"#fff"}}>
<h2 style={{fontSize:18,marginBottom:20}}>PropTrack</h2>
{["Dashboard","Properties","Repairs","Rent History","Damage Log"].map(t=>(
<div key={t} onClick={()=>setTab(t)} style={{padding:"10px 0",cursor:"pointer",color:tab===t?C.accent:"#fff"}}>{t}</div>
))}
</div>
<div style={{flex:1,padding:24}}>
<h1 style={{color:C.navy,marginBottom:20}}>{tab}</h1>
{tab==="Dashboard"&&(
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:14}}>
<div style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border}}>
<div style={{fontSize:12,color:C.muted}}>Monthly Rent</div>
<div style={{fontSize:24,fontWeight:700,color:C.green}}>${monthlyRent}</div>
</div>
<div style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border}}>
<div style={{fontSize:12,color:C.muted}}>Open Repairs</div>
<div style={{fontSize:24,fontWeight:700,color:C.red}}>{openRepairs}</div>
</div>
</div>
)}
{tab==="Properties"&&properties.map(p=>(
<div key={p.id} style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border,marginBottom:10}}>
<div style={{fontWeight:700}}>{p.address}</div>
<div style={{color:C.muted}}>Tenant: {p.tenant} — ${p.rent}/mo</div>
</div>
))}
{tab==="Repairs"&&repairs.map(r=>(
<div key={r.id} style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border,marginBottom:10}}>
<div style={{fontWeight:700}}>{r.title}</div>
<div style={{color:C.muted}}>{propName(r.propertyId)} — {r.status}</div>
</div>
))}
{tab==="Rent History"&&rentHistory.map(r=>(
<div key={r.id} style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border,marginBottom:10}}>
<div style={{fontWeight:700}}>{propName(r.propertyId)}</div>
<div style={{color:C.muted}}>${r.oldRent} → ${r.newRent} ({r.effectiveDate})</div>
</div>
))}
{tab==="Damage Log"&&damages.map(d=>(
<div key={d.id} style={{background:"#fff",padding:16,borderRadius:10,border:"1px solid "+C.border,marginBottom:10}}>
<div style={{fontWeight:700}}>{d.description}</div>
<div style={{color:C.muted}}>{propName(d.propertyId)} — Est. ${d.estimatedCost}</div>
</div>
))}
</div>
</div>
);
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
